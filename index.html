<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alexo — Pink Is For Everyone</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0b0b;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            padding: 28px 20px;
            text-align: center;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -2px;
        }

        .pink {
            color: #e94f91;
        }

        .hero {
            text-align: center;
            padding: 70px 20px 40px;
        }

        .hero h1 {
            font-size: 48px;
            line-height: 0.95;
            margin-bottom: 18px;
        }

        .hero p {
            color: #aaa;
            font-size: 18px;
        }

        .sticker-section {
            text-align: center;
            padding: 30px 20px 80px;
        }

        .sticker-section h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .sticker-section p {
            color: #aaa;
            margin-bottom: 30px;
        }

        .sticker {
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            display: block;
            margin: auto;
        }

        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 28px;
            background: #e94f91;
            color: white;
            text-decoration: none;
            border-radius: 999px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #666;
            border-top: 1px solid #222;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            ALEX<span class="pink">O</span>
        </div>
    </header>

    <main>

        <section class="hero">
            <h1>PINK IS<br><span class="pink">FOR EVERYONE.</span></h1>
            <p>Make your stuff yours.</p>
        </section>

        <section class="sticker-section">
            <h2>Stickers for everywhere.</h2>
            <p>Phones. Bikes. Laptops. Water bottles. Wherever you want.</p>

            <img
                class="sticker"
                src="sticker.jpg"
                alt="Alexo Pink sticker">

            <a class="button" href="#shop">SHOP STICKERS</a>
        </section>

    </main>

    <footer>
        © 2026 ALEXO
    </footer>

</body>
</html>
